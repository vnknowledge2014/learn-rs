name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  # Windows và macOS chưa từng được kiểm trong CI: báo kết quả nhưng chưa chặn merge.
  # Khi cả hai xanh ổn định, bỏ `continue-on-error`.
  cross-platform:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code
      - name: test
        run: cargo test --workspace --locked

  docs:
    name: cấu trúc tài liệu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra chương, crate, liên kết, SUMMARY, fence
        run: python3 scripts/check-docs.py

  book-code:
    name: mã trong sách biên dịch được
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Biên dịch khối mã và lời giải trong các chương
        run: python3 scripts/check-book-code.py --jobs 4

  book:
    name: mdBook build
    runs-on: ubuntu-latest
    # Render công thức đã được kiểm chứng dựng sạch tại máy (mdbook 0.5.x + mdbook-katex 0.10).
    # Trên CI dùng mdbook 0.4.52 + mdbook-katex 0.9.x; ghép phiên bản là best-effort nên
    # không chặn merge (nội dung katex-sạch đã xác minh cục bộ).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Cài mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz
          echo "$PWD" >> "$GITHUB_PATH"
      # Preprocessor render LaTeX ($...$, $$...$$); book.toml khai báo [preprocessor.katex].
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook-katex@0.9.4
      # Dựng từ thư mục tạm để không chép code/, .git, .claude... vào sách; cảnh báo là lỗi.
      - name: Build
        run: ./scripts/build-book.sh

  # Lỗ hổng mới được công bố có thể làm job này đỏ mà repo không đổi gì, nên không chặn merge.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Quét Cargo.lock
        run: cargo audit
        working-directory: code
